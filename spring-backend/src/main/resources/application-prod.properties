# Production Environment Profile

# PostgreSQL Configuration for Production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:railway}}}
spring.datasource.username=${PGUSER:${DB_USERNAME:${POSTGRES_USER:${SPRING_DATASOURCE_USERNAME:postgres}}}}
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# Storage Configuration for Production (defaults to local storage on Railway)
storage.type=${STORAGE_TYPE:local}
storage.local.base-dir=${STORAGE_LOCAL_BASE_DIR:./uploads}
firebase.storage.bucket-name=${FIREBASE_STORAGE_BUCKET:fir-5ee75.firebasestorage.app}

# Application Base URL for Production deployment
app.base-url=${APP_BASE_URL:https://scanmyfood.up.railway.app}

# Logging (Production level)
logging.level.org.springframework=WARN
logging.level.com.scanmyfood.backend=INFO
