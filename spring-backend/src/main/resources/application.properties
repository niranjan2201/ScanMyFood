spring.application.name=ScanMyFood Backend

# Default Active Profile (overridden by SPRING_PROFILES_ACTIVE env var in Railway)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Common Jackson Configuration
spring.jackson.property-naming-strategy=com.fasterxml.jackson.databind.PropertyNamingStrategies.SnakeCaseStrategy

# Common MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Gemini Developer API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model.name=${GEMINI_MODEL_NAME:gemini-3.5-flash-lite}
gemini.image.model.name=${GEMINI_IMAGE_MODEL_NAME:gemini-3.5-flash-lite}

# Multipart Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Common Server Port Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# Storage Configuration Default
storage.type=${STORAGE_TYPE:local}
storage.local.base-dir=${STORAGE_LOCAL_BASE_DIR:./uploads}

# Common Spring AI MCP Server Configuration
spring.ai.mcp.server.name=scanmyfood-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-message-endpoint=/mcp/messages
