# Test Profile Configuration
spring.profiles.active=test

# H2 in-memory Database for fast, deterministic unit & context testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never

# Mock / local storage for tests
storage.type=local
storage.local.base-dir=./target/test-uploads

# Disabled cloud dependencies in tests
firebase.storage.bucket-name=test-bucket
gemini.api.key=test-gemini-key
gemini.model.name=gemini-3.5-flash-lite
gemini.image.model.name=gemini-3.5-flash-lite
